# ========================================================================
# Google Cloud Build Pipeline for ANTRI Backend Deployment to Cloud Run
# ========================================================================
steps:
  # 1. Build Docker Container Image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/antri-backend:latest', '.']

  # 2. Push Image to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/antri-backend:latest']

  # 3. Deploy to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'antri-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/antri-backend:latest'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--set-env-vars'
      - 'NODE_ENV=production,ANTRI_PROVIDER=gemini,ANTRI_MODEL=gemini-3.7-flash'

images:
  - 'gcr.io/$PROJECT_ID/antri-backend:latest'

options:
  logging: CLOUD_LOGGING_ONLY
